<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/kamex_icon.png" />
    <link rel="apple-touch-icon" href="/img/kamex_icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5c6ef8" />
    <!-- Sin esto, iOS Safari subraya cualquier número con forma de teléfono y
         lo convierte en un link nativo de "Llamar", pisando el onClick propio
         (ej. abrir WhatsApp) que le pongamos en React. -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:image" content="/img/kamex_icon.png" />
    <meta name="twitter:image" content="/img/kamex_icon.png" />
    <title>%VITE_APP_NAME%</title>
  </head>
  <body>
    <!-- Splash estático: se ve desde el primer instante, antes de que cargue
         cualquier JS. React lo reemplaza al montar (createRoot().render() en
         main.jsx pisa los hijos de #root) — usa el mismo look que el
         <Loading> de App.jsx (fallback del Suspense de rutas) a propósito,
         para que no se note el cambio ni haya un parpadeo en el medio. Sin
         esto, quedaba un instante en blanco que un cliente podía confundir
         con que la app se colgó. -->
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;height:100dvh;background:#ffffff;color:#6e6455;font-family:Figtree, ui-sans-serif, system-ui, sans-serif;font-size:14px;">
        <img src="%VITE_LOGO_URL%" alt="%VITE_APP_NAME%" style="height:48px;width:auto;" />
        Cargando...
      </div>
    </div>
    <script src="/theme-init.js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
