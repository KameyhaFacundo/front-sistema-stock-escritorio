name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # No bloqueante todavía: hay ~21 errores de lint preexistentes (deuda
      # de código viejo, no de lo que se esté por mergear) — lo ideal es
      # limpiarlos y sacar este continue-on-error, pero hasta entonces
      # bloquear el CI acá rompería por algo ajeno a cada PR puntual.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
